name: Python detector

on:
  push:
  pull_request:

jobs:
  detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detector dependencies
        run: python -m pip install -e vision/detector
      - name: Compile Python sources
        run: python -m compileall -q vision/detector
      - name: Validate detector CLI
        run: python vision/detector/detect_esp32cam.py --help