[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semaforos-vision-detector"
version = "0.1.0"
description = "YOLO detector for an ESP32-CAM MJPEG stream"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<6",
    "ultralytics>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]